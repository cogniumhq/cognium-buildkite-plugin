name: Plugin Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Buildkite Plugin Linter
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Buildkite plugin linter
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/plugin:ro" \
            buildkite/plugin-linter:v2.1.0 \
            --id cogniumhq/cognium \
            --path /plugin

  test:
    name: Buildkite Plugin Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Buildkite plugin tester
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/plugin:ro" \
            buildkite/plugin-tester:v4.3.0
  integration:
    name: Real Cognium Integration Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify warn-only mode
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/plugin" \
            -w /plugin \
            node:20.19-bookworm \
            bash -c '
              set +e

              BUILDKITE_PLUGIN_COGNIUM_PATH=tests/integration \
              BUILDKITE_PLUGIN_COGNIUM_FAIL_ON_FINDINGS=false \
              bash hooks/command

              EXIT_CODE=$?

              echo "Warn-only exit code: $EXIT_CODE"

              if [ "$EXIT_CODE" -ne 0 ]; then
                echo "Expected warn-only mode to exit with code 0."
                exit 1
              fi

              echo "Warn-only integration test passed."
            '

      - name: Verify fail-on-findings mode
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/plugin" \
            -w /plugin \
            node:20.19-bookworm \
            bash -c '
              set +e

              BUILDKITE_PLUGIN_COGNIUM_PATH=tests/integration \
              BUILDKITE_PLUGIN_COGNIUM_FAIL_ON_FINDINGS=true \
              bash hooks/command

              EXIT_CODE=$?

              echo "Fail-on-findings exit code: $EXIT_CODE"

              if [ "$EXIT_CODE" -ne 1 ]; then
                echo "Expected fail-on-findings mode to exit with code 1."
                exit 1
              fi

              echo "Fail-on-findings integration test passed."
            '