name: Cognium SAST
description: Run Cognium static application security testing scans in Buildkite
author: https://github.com/cogniumhq

requirements:
  - node
  - npm

configuration:
  properties:
    path:
      type: string
      default: "."

    package-version:
      type: string
      pattern: '^[0-9]+\.[0-9]+\.[0-9]+([\-+][0-9A-Za-z.-]+)?$'
      default: "4.9.16"

    format:
      type: string
      enum:
        - text
        - json
        - sarif
      default: "text"

    output:
      type: string

    severity:
      type: string
      pattern: '^(critical|high|medium|low)(,(critical|high|medium|low))*$'

    category:
      type: string
      pattern: '^(security|reliability|performance|maintainability|architecture)(,(security|reliability|performance|maintainability|architecture))*$'

  additionalProperties: false